<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог креаторов — CreatorHub</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/interior.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-head"></header>
  <main class="interior" id="main">
    <div class="interior__shell">
      <nav class="trail" aria-label="Хлебные крошки"><a href="index.html">Главная</a><span aria-hidden="true">/</span><span aria-current="page">Каталог</span></nav>
      <h1 class="interior__title">Каталог креаторов<span class="interior__period">.</span></h1>
      <p class="interior__lead">Найдите автора по тематике, площадке и размеру аудитории.</p>
      <form class="discover" id="filter-form" role="search" aria-label="Поиск и фильтры каталога">
        <div class="discover__search">
          <label class="visually-hidden" for="creator-search">Поиск по имени</label>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input type="search" id="creator-search" name="q" placeholder="Имя или псевдоним автора" autocomplete="off">
        </div>
        <div class="discover__filters">
          <label class="discover__field">Платформа<select name="platform"><option value="">Все платформы</option></select></label>
          <label class="discover__field">Тематика<select name="topic"><option value="">Все тематики</option></select></label>
          <label class="discover__field">Подписчики<select name="audience"><option value="">Любая аудитория</option><option value="micro">До 10 тыс.</option><option value="small">От 10 до 100 тыс.</option><option value="medium">От 100 до 500 тыс.</option><option value="large">От 500 тыс.</option></select></label>
          <label class="discover__field">Сортировка<select name="sort"><option value="popular">Сначала популярные</option><option value="low">Меньше подписчиков</option><option value="high">Больше подписчиков</option><option value="new">Сначала новые</option></select></label>
          <button class="discover__reset" type="reset">Сбросить фильтры</button>
        </div>
      </form>
      <section aria-labelledby="results-title" class="discover__results">
        <div class="discover__heading"><h2 id="results-title">Авторы</h2><span id="creator-count" role="status" aria-live="polite"></span></div>
        <div class="discover__grid" id="creator-grid"></div>
        <div class="discover__empty" id="empty-results" hidden><h3>Совпадений пока нет</h3><p>Попробуйте другое имя или измените параметры поиска.</p><button type="button" class="interior__button" id="clear-results">Показать всех авторов</button></div>
      </section>
    </div>
  </main>
  <footer class="site-foot"></footer>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/interior.js"></script>
</body>
</html>
